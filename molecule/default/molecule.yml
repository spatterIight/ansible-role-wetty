---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: wetty-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        wetty_enabled: true
        wetty_hostname: "localhost"
        wetty_uid: "0"
        wetty_gid: "0"
        wetty_base_path: "/wetty"
        wetty_container_labels_traefik_enabled: false
        wetty_container_http_bind_port: "127.0.0.1:3000"

        devture_systemd_docker_base_systemd_path: /etc/systemd/system
        devture_systemd_docker_base_systemd_unit_home_path: /root
        devture_systemd_docker_base_host_command_sh: /bin/sh
        devture_systemd_docker_base_host_command_docker: /usr/bin/docker
        devture_playbook_help_container_retries_count: 3
        devture_playbook_help_container_retries_delay: 10

  env:
    # This is a hack to resolve https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
